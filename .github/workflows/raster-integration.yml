name: Raster Core integration checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Verify frozen converter and app
        run: npm run check && npm run check:app
      - name: Install browser for end-to-end inspection
        run: npx playwright install --with-deps chromium
      - name: Test Raster Core inspection, optional resize and existing conversion
        run: npx playwright test browser-tests/raster-inspection.spec.ts browser-tests/raster-resize.spec.ts --project=chromium
