name: Raster Core integration checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Verify frozen converter and app
        run: npm run check && npm run check:app
      - name: Create and inspect release attestation artifact
        run: node scripts/write-release-attestation.mjs
      - name: Install browser for end-to-end inspection
        run: npx playwright install --with-deps chromium firefox
      - name: Test Raster Core inspection, optional resize and existing conversion
        run: npx playwright test browser-tests/raster-inspection.spec.ts browser-tests/raster-resize.spec.ts browser-tests/raster-raw-pipeline.spec.ts --project=chromium
      - name: Stress-test resizing in Chromium, Firefox and mobile emulation
        run: npx playwright test browser-tests/resize-stress.spec.ts --project=chromium --project=firefox --project=chromium-mobile
      - name: Ten-image acceptance on Chromium, Firefox and mobile emulation
        run: npx playwright test browser-tests/release-acceptance.spec.ts --project=chromium --project=firefox --project=chromium-mobile

      - name: Run on-device diagnostics UI and cancel in desktop/mobile browsers
        run: npx playwright test browser-tests/device-diagnostics.spec.ts --project=chromium --project=firefox --project=chromium-mobile
